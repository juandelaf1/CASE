[project]
name = "case"
version = "1.0.0"
description = "CASE — AI Decision Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.6",
    "mypy>=1.13.0",
    "jsonschema>=4.0.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008", "UP042", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["case_api", "case_core", "case_infra", "logistics_adapter", "usgs_adapter"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
    "live: marks tests that require live external services or API keys (opt-in)",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["case_*", "logistics_adapter", "usgs_adapter"]

[tool.coverage.run]
source = ["src/case_core", "src/case_api", "src/case_infra"]
omit = ["tests/*", "*__pycache__*"]