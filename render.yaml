services:
  - type: web
    name: case-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: RUN_MODE
        value: api
      - key: PORT
        value: 8000
      - key: CASE_DB_PATH
        value: /data/case_audit.db
      # Security: for non-local/public deployments set strict mode + credentials in Render dashboard (sync: false).
      # shared/prod are fail-closed at startup without credentials; shared multi-consumer remains NOT demonstrated/blocked.
      - key: CASE_SECURITY_MODE
        value: dev
      - key: CASE_API_KEY
        sync: false
      - key: CASE_CONSUMER_ID
        value: default-consumer
      - key: CASE_TENANT_ID
        sync: false
      - key: CASE_API_SCOPES
        value: case:evaluate,case:read,case:triage,case:audit:read,case:hitl:read,case:hitl:write,case:decision:read,case:compare
      - key: CASE_PROVIDER
        value: mock
    disk:
      mountPath: /data
      sizeGB: 1
    plan: free
    autoDeploy: true

  - type: web
    name: case-ui
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: RUN_MODE
        value: streamlit
      - key: PORT
        value: 8501
      - key: CASE_API_BASE_URL
        value: https://case-xhvh.onrender.com
    plan: free
    autoDeploy: true
